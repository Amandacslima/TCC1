<div class="p-10 max-w-5xl mx-auto font-sans">
  
  <!-- Breadcrumb com botão de voltar -->
  <div class="flex justify-between items-center mb-6">
    <div class="text-sm text-gray-500 flex items-center gap-2">
      <a routerLink="/aluno/minhas-disciplinas" class="hover:text-[#1468D8] transition-colors">Minhas disciplinas</a> 
      <span>&gt;</span> 
      <span class="font-medium text-gray-900">{{ codigoDisciplina }}</span>
    </div>
    <div class="w-10 h-10 bg-blue-200 text-blue-800 rounded-full flex items-center justify-center font-bold">
      AC
    </div>
  </div>

  <!-- Cabeçalho da Disciplina Atual -->
  <div class="bg-white border border-gray-200 rounded-2xl p-8 mb-8 shadow-sm">
    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">{{ codigoDisciplina }}</span>
    <h2 class="text-3xl font-bold text-[#0B1F3A] mt-1 mb-2">{{ disciplinaInfo.nome }}</h2>
    <p class="text-gray-600 text-sm mb-6">{{ disciplinaInfo.professor }}</p>

    <div class="flex items-center gap-4">
      <div class="flex-1 bg-gray-100 h-2.5 rounded-full overflow-hidden">
        <div class="bg-[#1468D8] h-full rounded-full" [style.width]="disciplinaInfo.progresso + '%'"></div>
      </div>
      <span class="text-sm font-bold text-gray-700">{{ disciplinaInfo.progresso }}% concluído</span>
    </div>
  </div>

  <!-- Estrutura de Módulos e Aulas -->
  <h3 class="text-xl font-bold text-[#0B1F3A] mb-4">Conteúdo Programático (Módulos de Aula)</h3>
  
  <div class="space-y-4">
    <div *ngFor="let mod of disciplinaInfo.modulos; let i = index" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <h4 class="font-bold text-gray-800 text-base">{{ mod.titulo }}</h4>
        <span class="text-xs px-2.5 py-1 rounded-full font-medium" 
              [ngClass]="mod.concluido ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-gray-100 text-gray-600'">
          {{ mod.concluido ? 'Concluído' : 'Em andamento' }}
        </span>
      </div>

      <!-- Lista de aulas dentro do módulo -->
      <ul class="border-t border-gray-100 pt-3 space-y-2">
        <li *ngFor="let aula of mod.aulas" class="flex items-center justify-between text-sm text-gray-600 py-1.5 hover:bg-gray-50 px-3 rounded-lg transition-colors">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-[#1468D8]"></span>
            {{ aula }}
          </span>
          <button class="text-xs text-[#1468D8] font-bold hover:underline">Assistir / Acessar</button>
        </li>
      </ul>
    </div>
  </div>

</div>
